apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryhub-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memoryhub-ui
  template:
    metadata:
      labels:
        app: memoryhub-ui
      annotations:
        alpha.image.policy.openshift.io/resolve-names: '*'
    spec:
      containers:
      - name: memoryhub-ui
        image: memoryhub-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memoryhub-ui
spec:
  selector:
    app: memoryhub-ui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: memoryhub-ui
spec:
  to:
    kind: Service
    name: memoryhub-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
