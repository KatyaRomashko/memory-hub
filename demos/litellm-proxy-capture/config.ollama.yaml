# Fully local: the agent's model is Ollama too, so a live demo needs no API key
# and nothing leaves the machine. Use the SAME model as extraction
# (MEMORYHUB_CAPTURE_EXTRACT_MODEL) so Ollama does not swap weights between the
# agent's reply and the extraction pass -- swapping costs seconds on camera.
model_list:
  - model_name: poc-model
    litellm_params:
      model: os.environ/POC_AGENT_MODEL       # e.g. ollama_chat/qwen2.5:7b
      api_base: os.environ/POC_AGENT_API_BASE # http://localhost:11434

litellm_settings:
  callbacks: memoryhub_capture.proxy_handler_instance
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
